<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mosaic</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa;
    --fg: #111;
    --muted: #666;
    --accent: #4a5fbf;
    --card: #fff;
    --border: #e2e2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --fg: #eee;
      --muted: #999;
      --accent: #8aa0e8;
      --card: #232323;
      --border: #333;
    }
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 0;
  }
  header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: -0.02em;
  }
  header .sub {
    color: var(--muted);
    font-size: 13px;
    margin-top: 4px;
  }
  main {
    padding: 24px 32px;
    max-width: 960px;
    margin: 0 auto;
  }
  section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 20px;
  }
  section h2 {
    margin: 0 0 12px;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }
  .stat {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
  }
  .stat .label {
    color: var(--muted);
    font-size: 12px;
  }
  .stat .value {
    font-size: 20px;
    font-weight: 600;
    margin-top: 2px;
  }
  .change {
    border-top: 1px solid var(--border);
    padding: 12px 0;
    display: grid;
    grid-template-columns: 130px 1fr;
    gap: 16px;
    color: inherit;
    text-decoration: none;
  }
  .change:hover { background: var(--bg); }
  .change:first-of-type {
    border-top: 0;
  }
  .change .hash {
    font-family: ui-monospace, "SF Mono", monospace;
    color: var(--accent);
    font-size: 13px;
  }
  .change .body {
    min-width: 0;
  }
  .change .intent {
    font-weight: 500;
    margin-bottom: 4px;
    word-break: break-word;
  }
  .change .meta {
    color: var(--muted);
    font-size: 12px;
  }
  .branch {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-top: 1px solid var(--border);
  }
  .branch:first-of-type {
    border-top: 0;
  }
  .branch .name {
    font-weight: 500;
  }
  .branch .tips {
    font-family: ui-monospace, monospace;
    color: var(--muted);
    font-size: 12px;
  }
  footer {
    color: var(--muted);
    font-size: 12px;
    padding: 24px 32px;
    text-align: center;
  }
  .empty {
    color: var(--muted);
    font-style: italic;
  }
</style>
</head>
<body>
<header>
  <h1>Mosaic</h1>
  <div class="sub">Agent-native version control · web view</div>
</header>
<main>
  <section>
    <h2>Repository</h2>
    <div class="stat-grid" id="stats">Loading…</div>
  </section>
  <section>
    <h2>Branches</h2>
    <div id="branches">Loading…</div>
  </section>
  <section>
    <h2>Recent changes</h2>
    <div id="changes">Loading…</div>
  </section>
</main>
<footer>Served by mosaic-serve</footer>
<script>
function shortHash(s) { return s.slice(0, 12); }
function fmtTs(s) {
  if (!s) return "";
  const d = new Date(s * 1000);
  return d.toISOString().replace("T", " ").slice(0, 19);
}
async function load() {
  try {
    const health = await fetch("/api/v1/health").then(r => r.json());
    document.getElementById("stats").innerHTML = `
      <div class="stat"><div class="label">changes</div><div class="value">${health.changes}</div></div>
      <div class="stat"><div class="label">branches</div><div class="value">${health.branches}</div></div>
      <div class="stat"><div class="label">status</div><div class="value">${health.ok ? "ok" : "fail"}</div></div>`;

    const branches = await fetch("/api/v1/branches").then(r => r.json());
    const branchEl = document.getElementById("branches");
    if (branches.length === 0) {
      branchEl.innerHTML = '<div class="empty">no branches yet</div>';
    } else {
      branchEl.innerHTML = branches.map(b => `
        <div class="branch">
          <div class="name">${b.name}</div>
          <div class="tips">${b.tips.map(shortHash).join(", ")}</div>
        </div>`).join("");
    }

    const changes = await fetch("/api/v1/changes").then(r => r.json());
    const changesEl = document.getElementById("changes");
    if (changes.length === 0) {
      changesEl.innerHTML = '<div class="empty">no changes yet</div>';
    } else {
      changesEl.innerHTML = changes.slice().reverse().map(c => `
        <a class="change" href="/changes/${c.id}">
          <div class="hash">${shortHash(c.id)}</div>
          <div class="body">
            <div class="intent">${(c.intent || "(no intent)").replace(/</g, "&lt;")}</div>
            <div class="meta">${c.author.replace(/</g, "&lt;")} · ${fmtTs(c.timestamp)} · ${c.file_count} file${c.file_count === 1 ? "" : "s"}</div>
          </div>
        </a>`).join("");
    }
  } catch (e) {
    document.body.insertAdjacentHTML("beforeend", `<pre style="color:red;padding:24px">${e.message}</pre>`);
  }
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
