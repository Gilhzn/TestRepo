<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mosaic · change</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa;
    --fg: #111;
    --muted: #666;
    --accent: #4a5fbf;
    --card: #fff;
    --border: #e2e2e2;
    --add-bg: #e6ffec;
    --add-fg: #1b4332;
    --del-bg: #ffeef0;
    --del-fg: #67101a;
    --eq-fg: #555;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --fg: #eee;
      --muted: #999;
      --accent: #8aa0e8;
      --card: #232323;
      --border: #333;
      --add-bg: #0d2f1c;
      --add-fg: #88e8a4;
      --del-bg: #2f0d12;
      --del-fg: #f08894;
      --eq-fg: #999;
    }
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 0;
  }
  header {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  header h1 { margin: 0; font-size: 18px; }
  header .nav { font-size: 13px; color: var(--muted); margin-top: 4px; }
  header .nav a { color: var(--accent); text-decoration: none; }
  main { padding: 20px 32px; max-width: 1100px; margin: 0 auto; }
  section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 16px;
  }
  .meta { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; font-size: 13px; }
  .meta .k { color: var(--muted); }
  .file {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .file-head {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: ui-monospace, monospace;
    font-size: 13px;
  }
  .file-head .status {
    padding: 1px 8px;
    border-radius: 4px;
    font-size: 11px;
    background: var(--add-bg);
    color: var(--add-fg);
  }
  .file-head .status.modified { background: #fff4cf; color: #5a4500; }
  .file-head .status.removed { background: var(--del-bg); color: var(--del-fg); }
  .file-head .status.unchanged { background: var(--bg); color: var(--muted); }
  pre.diff {
    margin: 0;
    padding: 8px 0;
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 12.5px;
    line-height: 1.45;
    overflow-x: auto;
  }
  .diff-line { padding: 0 14px; white-space: pre; }
  .diff-line.insert { background: var(--add-bg); color: var(--add-fg); }
  .diff-line.insert::before { content: "+ "; opacity: 0.7; }
  .diff-line.delete { background: var(--del-bg); color: var(--del-fg); }
  .diff-line.delete::before { content: "- "; opacity: 0.7; }
  .diff-line.equal { color: var(--eq-fg); }
  .diff-line.equal::before { content: "  "; }
  .empty { color: var(--muted); font-style: italic; padding: 10px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .rev { padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; font-size: 13px; }
  .rev .who { font-weight: 600; }
  .rev .verdict { font-size: 11px; padding: 1px 8px; border-radius: 4px; margin-left: 6px; }
  .rev .verdict.Approved { background: var(--add-bg); color: var(--add-fg); }
  .rev .verdict.RequestedChanges { background: var(--del-bg); color: var(--del-fg); }
  .rev .verdict.Commented { background: var(--bg); color: var(--muted); }
  .rev .body { margin-top: 4px; white-space: pre-wrap; }
  textarea, input[type=text] {
    width: 100%; box-sizing: border-box; font: inherit; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg);
  }
  .btnrow { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.secondary { background: var(--card); color: var(--fg); }
  .formmsg { font-size: 12px; margin-top: 6px; min-height: 16px; }
  .formmsg.err { color: var(--del-fg); }
  .formmsg.ok { color: var(--add-fg); }
</style>
</head>
<body>
<header>
  <h1 id="title">change · loading</h1>
  <div class="nav"><a href="/">← back to dashboard</a></div>
</header>
<main>
  <section><div id="meta" class="meta">loading…</div></section>
  <div id="files"></div>
  <section id="review">
    <h2>Review</h2>
    <div id="reviewList" class="empty">loading…</div>
    <form id="reviewForm">
      <textarea id="reviewBody" rows="3" placeholder="Leave a comment, or approve / request changes…"></textarea>
      <div class="btnrow">
        <button type="submit" id="commentBtn">Comment</button>
        <button type="button" class="secondary" data-verdict="Approved">Approve</button>
        <button type="button" class="secondary" data-verdict="RequestedChanges">Request changes</button>
      </div>
      <div class="formmsg" id="reviewMsg"></div>
    </form>
  </section>
</main>
<script>
function escape(s) {
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function shortHash(s) { return s.slice(0, 12); }

// Identity serializes as an externally-tagged enum: {Human:{email,name}} | {Agent:{name,...}}.
function identName(id) {
  if (!id) return "(unknown)";
  if (typeof id === "string") return id;
  if (id.Human) return id.Human.name ? `${id.Human.name} <${id.Human.email}>` : id.Human.email;
  if (id.Agent) return `${id.Agent.name} (agent)`;
  return JSON.stringify(id);
}

async function loadChange(id) {
  document.getElementById("title").textContent = "change " + shortHash(id);

  const detailRes = await fetch("/api/v1/changes/" + encodeURIComponent(id));
  if (!detailRes.ok) {
    document.getElementById("meta").innerHTML = "<div class=empty>change not found</div>";
    return;
  }
  const detail = await detailRes.json();
  const ts = new Date(detail.timestamp * 1000).toISOString().replace("T", " ").slice(0, 19);
  document.getElementById("meta").innerHTML = `
    <div class=k>id</div><div><code>${id}</code></div>
    <div class=k>author</div><div>${escape(detail.author)}</div>
    <div class=k>intent</div><div>${escape(detail.intent || "(no intent)")}</div>
    <div class=k>timestamp</div><div>${ts}</div>
    <div class=k>parents</div><div>${(detail.deps && detail.deps.length) ? detail.deps.map(d => `<a href="/changes/${d}"><code>${shortHash(d)}</code></a>`).join(", ") : "(root)"}</div>
    <div class=k>files</div><div>${detail.files.length}</div>
  `;

  const diffRes = await fetch("/api/v1/changes/" + encodeURIComponent(id) + "/diff");
  const diffs = await diffRes.json();
  const root = document.getElementById("files");
  if (!diffs.length) {
    root.innerHTML = '<div class=empty>no files in this change</div>';
    return;
  }
  root.innerHTML = diffs.map(d => `
    <div class="file">
      <div class="file-head">
        <span>${escape(d.path)}</span>
        <span class="status ${d.status}">${d.status}</span>
      </div>
      <pre class="diff">${d.hunks.map(h => `<div class="diff-line ${h.tag}">${escape(h.line || "")}</div>`).join("")}</pre>
    </div>`).join("");
}

async function loadReview(id) {
  const list = document.getElementById("reviewList");
  const [comments, approvals] = await Promise.all([
    fetch("/api/v1/changes/" + encodeURIComponent(id) + "/comments").then(r => r.ok ? r.json() : []),
    fetch("/api/v1/changes/" + encodeURIComponent(id) + "/approvals").then(r => r.ok ? r.json() : []),
  ]);
  const rows = [];
  for (const a of approvals) {
    rows.push(`<div class="rev"><span class="who">${escape(identName(a.reviewer))}</span>` +
      `<span class="verdict ${escape(a.verdict)}">${escape(a.verdict)}</span>` +
      (a.body ? `<div class="body">${escape(a.body)}</div>` : "") + `</div>`);
  }
  for (const c of comments) {
    rows.push(`<div class="rev"><span class="who">${escape(identName(c.author))}</span>` +
      `<div class="body">${escape(c.body)}</div></div>`);
  }
  list.className = rows.length ? "" : "empty";
  list.innerHTML = rows.length ? rows.join("") : "No comments or approvals yet.";
}

function wireReviewForm(id) {
  const form = document.getElementById("reviewForm");
  const body = document.getElementById("reviewBody");
  const msg = document.getElementById("reviewMsg");
  const setMsg = (text, cls) => { msg.textContent = text; msg.className = "formmsg " + (cls || ""); };

  async function post(path, payload) {
    setMsg("Signing…", "");
    try {
      const res = await fetch(path, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { setMsg(data.error || ("HTTP " + res.status), "err"); return; }
      body.value = "";
      setMsg("Saved as " + (data.author || data.reviewer || "you") + ".", "ok");
      await loadReview(id);
    } catch (e) {
      setMsg(String(e), "err");
    }
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    if (!body.value.trim()) { setMsg("Comment body is empty.", "err"); return; }
    post("/api/v1/changes/" + encodeURIComponent(id) + "/comments/local", { body: body.value });
  });
  for (const btn of form.querySelectorAll("button[data-verdict]")) {
    btn.addEventListener("click", () => {
      post("/api/v1/changes/" + encodeURIComponent(id) + "/approvals/local",
        { verdict: btn.dataset.verdict, body: body.value.trim() || null });
    });
  }
}

async function load() {
  const id = location.pathname.split("/").pop();
  await loadChange(id);
  await loadReview(id);
  wireReviewForm(id);
}
load();
</script>
</body>
</html>
