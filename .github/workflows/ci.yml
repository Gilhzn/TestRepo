name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev fuse3 pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test (with live feature)
        run: cargo test --workspace --features mosaic-sdk/live

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build the binaries the TS tests drive
        run: cargo build -p mosaic-cli -p mosaic-server
      - name: Install + test
        working-directory: mosaic-sdk-ts
        run: |
          npm install --no-audit --no-fund
          npx tsc
          node --test dist/test/*.test.js

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build the binaries the Python tests drive
        run: cargo build -p mosaic-cli -p mosaic-server
      - name: Install + test
        working-directory: mosaic-sdk-py
        run: |
          pip install websockets
          python -m unittest tests/test_client.py
