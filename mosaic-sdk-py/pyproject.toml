[project]
name = "mosaic-sdk"
version = "0.0.1"
description = "Python SDK for Mosaic VCS"
license = { text = "Apache-2.0 OR MIT" }
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
live = ["websockets>=12"]
test = ["websockets>=12"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mosaic"]
